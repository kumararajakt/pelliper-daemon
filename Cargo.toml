[package]
name = "pelliper-daemon"
version = "0.1.0"
edition = "2021"
description = "Background IMAP/SMTP sync daemon and SQLite cache for Pelliper"

[dependencies]
anyhow = "1"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
directories = "5"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "hostname"] }
mail-parser = "0.9"
oo7 = { version = "0.4", default-features = false, features = ["tokio", "openssl_crypto"] }
quick-xml = { version = "0.37", features = ["serialize"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "0.26"
