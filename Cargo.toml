[package]
name = "pelliper-daemon"
version = "0.1.0"
edition = "2021"
description = "Background IMAP/SMTP sync daemon and SQLite cache for Pelliper"

[dependencies]
anyhow = "1"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
